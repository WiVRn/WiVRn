name: Bug Report
description: Create a report to help us improve WiVRn.
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: |
        Please describe the bug here...
        *** Do NOT use AI to generate a bug report ***
        Write down what is wrong, attach logs and screenshots when relevant.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Provide the steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error

  - type: input
    attributes:
      label: WiVRn Version
      description: Provide the version or commit hash of WiVRn.
      placeholder: Version or commit
    validations:
      required: true

  - type: input
    attributes:
      label: Installation method
      description: Describe how WiVRn and OpenComposite/xrizer were installed
      placeholder: flatpak --user, flatpak, AUR, Gentoo/Guru, built from sources...

  - type: textarea
    attributes:
      label: Server Logs
      description: Provide the `wivrn-server` output.
      placeholder: |
        Add the output of the wivrn-server here.
        If more than a few lines, prefer file attachment.

  - type: textarea
    attributes:
      label: Vulkan Info
      description: Provide the output of `vulkaninfo --summary` command.
      render: text
      placeholder: Attach the output as a file here.

  - type: dropdown
    id: hmd
    attributes:
      label: What HMD did the bug occur on?
      options:
        - Quest
        - Quest 2
        - Quest Pro
        - Quest 3
        - Quest 3S
        - Pico 4
        - Pico 4 Pro/Enterprise
        - Pico Neo 3
        - HTC Vive Focus 3
        - HTC Vive XR Elite
        - Lynx R1
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: ADB Logs
      description: Provide the output of `adb logcat` command.
      render: text
      placeholder: Attach the output of adb logcat as a file.
