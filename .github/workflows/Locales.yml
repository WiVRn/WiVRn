name: Locales
on: [push, pull_request]
jobs:
  locale-check:
    name: Locale check
    runs-on: ubuntu-24.04
    if: ${{ vars.APK_ONLY == '' }}
    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install gettext
        pip install polib PyGithub

    - name: Check that .po files are up to date
      run: |
        if [[ "${{github.ref}}" == 'refs/heads/master' ]] ; then
          tools/check_po.py --manage-issues --github-repository "${{ github.repository }}" --github-token "${{ github.token }}"
        elif [[ "${{github.base_ref}}" != "" ]] ; then
          FILES=$(gh api repo/${{github.repository}}/pulls/${{github.event.pull_request.id}}/files | jq --raw-output '[.[].filename | select(. | startswith("locale/"))] | join(",")')
          echo "Locale files changed by pull request: ${FILES}"
          tools/check_po.py --fail-on "${FILES}"
        else
          tools/check_po.py
        fi
