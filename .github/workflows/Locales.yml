name: Locales
on: [push, pull_request]
jobs:
  locale-check:
    name: Locale check
    runs-on: ubuntu-24.04
    if: ${{ vars.APK_ONLY == '' }}
    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install gettext
        pip install polib PyGithub

    - name: Check that .po files are up to date
      run: |
        if [[ "${{github.ref}}" == 'refs/heads/master' ]] ; then
          tools/check_po.py --manage-issues --github-repository "${{ github.repository }}" --github-token "${{ github.token }}"
        elif [[ "${{github.base_ref}}" != "" ]] ; then
          tools/check_po.py --fail-on "$(git diff --name-only $(git merge-base "origin/${{github.base_ref}}" HEAD)) locale"
        else
          tools/check_po.py
        fi
