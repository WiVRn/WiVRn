name: Release APK Only

on:
  push:
    branches: [ "master" ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build-android-only:
    name: Android
    runs-on: ubuntu-26.04
    if: ${{ vars.APK_ONLY != '' }}

    strategy:
      matrix:
        buildtype: ['Release', 'Debug', 'DebugWithValidationLayer']

    steps:
    - uses: actions/checkout@v6
      with:
        # Checkout from upstream instead of WiVRn-APK to ensure the GIT_DESC variable is set correctly
        repository: 'WiVRn/WiVRn'
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install glslang-tools spirv-tools librsvg2-bin gettext npm
        wget https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
        sudo dpkg --install KTX-Software-4.4.2-Linux-x86_64.deb
        npm install --global @gltf-transform/cli@4.1.1

    - name: Check for Secret availability
      id: secret-check
      shell: bash
      run: |
        if [[ "${{ secrets.APK_SIGNINGKEYPASSWORD }}" != '' && "${{ secrets.APK_KEYSTORE_BASE64 }}" != '' ]]; then
          echo "available=true" >> $GITHUB_OUTPUT;
        else
          echo "available=false" >> $GITHUB_OUTPUT;
        fi

    - name: Secrets
      if: ${{ github.event_name != 'pull_request' && steps.secret-check.outputs.available == 'true' }}
      env:
        APK_SIGNINGKEYPASSWORD: ${{ secrets.APK_SIGNINGKEYPASSWORD }}
        APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
      run: |
        echo signingKeyPassword="$APK_SIGNINGKEYPASSWORD" > gradle.properties
        echo "$APK_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > ks.keystore

    - name: Build
      run: |

        KS_OPTS="-DCPACK_APK_KEYSTORE=$(pwd)/ks.keystore -DCPACK_APK_KEYSTORE_PASSWORD=$(cat signing_key_password) -DCPACK_APK_KEY_ALIAS=default_key -DCPACK_APK_KEY_PASSWORD=$(cat signing_key_password)"
        SUFFIX=".github.nightly"
        APPNAME="WiVRn Nightly"

        cmake --preset android-${{ matrix.buildtype }} -B build \
          -DCMAKE_ANDROID_NDK=$ANDROID_NDK_LATEST_HOME \
          -DWIVRN_APK_VERSION_CODE=$VERSION_CODE \
          -DWIVRN_APK_PACKAGE=org.meumeu.wivrn$SUFFIX \
          -DWIVRN_CSS=images/wivrn-nightly.css \
          -DWIVRN_APK_NAME="$APPNAME" \
          -DWIVRN_COMPRESS_GLB=ON \
          -DFETCHCONTENT_BASE_DIR=${{github.workspace}}/cmake-fetch \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          $KS_OPTS

        ( cd build && ninja && cpack )

    - name: Prepare before archiving artifacts
      run: |
        mkdir apk
        mv build/_CPack_Packages/Android/APK/wivrn.apk apk/WiVRn-${{ matrix.buildtype }}.apk

        mkdir debug
        mv build/_CPack_Packages/Android/APK/wivrn/lib/arm64-v8a/*.so debug/

        find debug -name libopenxr_loader.so -delete

    - name: Archive APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-${{ (github.event_name == 'pull_request' && matrix.buildtype == 'Release') && 'Release-unsigned' || matrix.buildtype }}
        path: apk/*.apk
        retention-days: 7

    - name: Archive debug symbols
      if: ${{ matrix.buildtype != 'Release' }}
      uses: actions/upload-artifact@v7
      with:
        name: symbols-${{ matrix.buildtype }}
        path: debug/**/*.so
        retention-days: 7

  release:
    name: Create APK release
    runs-on: ubuntu-24.04
    needs: build-android-only
    if: ${{ vars.APK_ONLY != '' }}

    steps:
    - name: Download APK artifacts
      uses: actions/download-artifact@v8
      with:
        path: apk
        pattern: 'apk-*'
        merge-multiple: true

    - name: Rename APK artifacts
      run: |
        cd apk
        for f in *.apk; do
          BASENAME=`echo ${f}|awk -F '-APK-' '{print $2}'`
          mv "${f}" "org.meumeu.wivrn-${BASENAME}"
        done

    - name: Download APK debug artifacts
      uses: actions/download-artifact@v8
      with:
        path: symbols
        pattern: 'symbols-*'
        merge-multiple: false

    - name: Zip APK debug artifacts
      run: |
        cd symbols
        zip -r ../debug-symbols.zip .

    - name: APK Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.DOWNSTREAM_GITHUB_TOKEN }}
        tag_name: "apk-${{ github.sha }}"
        generate_release_notes: true
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          apk/*.apk
          debug-symbols.zip
